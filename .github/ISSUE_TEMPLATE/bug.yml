name: Bug report
description: Report a reproducible validator, schema, or documentation problem
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, tag, or commit.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction
      description: Include the command and a minimal redacted assessment.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
